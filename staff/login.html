<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Milky Guest House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--ink);}
  .login-card{width:360px;max-width:92vw;background:var(--ivory);border-radius:12px;padding:34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-card .mark{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--ink);text-align:center;}
  .login-card .sub{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass);text-align:center;margin-top:4px;margin-bottom:26px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
  .field input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;}
  .login-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;text-align:center;margin-top:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:6px;background:var(--ink);color:#fff;transition:opacity .15s;}
  .login-btn:hover{opacity:.85;}
  .error{font-size:12.5px;color:var(--rust);text-align:center;margin-top:4px;min-height:16px;}
  .back{display:block;text-align:center;font-size:12px;color:var(--text-dim);text-decoration:none;margin-top:18px;}
  .back:hover{color:var(--text);}
  .hint{font-size:11.5px;color:var(--text-dim);text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
</style>
</head>
<body>

<div class="login-card">
  <div class="mark">Milky Guest House</div>
  <div class="sub">Staff System</div>

  <form id="loginForm">
    <div class="field"><label>Username</label><input id="lUser" autocomplete="Milky_Guest_House" placeholder="user name"></div>
    <div class="field"><label>Password</label><input id="lPass" type="password" autocomplete="milky123" placeholder="password"></div>
    <div class="error" id="loginError"></div>
    <button type="submit" class="login-btn">Sign In</button>
  </form>

  <div class="hint">Demo credentials — <span class="mono">frontdesk</span> / <span class="mono">milky2026</span></div>
  <a class="back" href="../index.html">← Back to website</a>
</div>

<script>
  const STAFF_USERS = { "Milky_Guest_House": "milky123", "admin": "milky2026" };

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const user = document.getElementById('lUser').value.trim();
    const pass = document.getElementById('lPass').value;
    const errEl = document.getElementById('loginError');

    if(STAFF_USERS[user] && STAFF_USERS[user] === pass){
      sessionStorage.setItem('milkyStaffUser', user);
      window.location.href = 'index.html';
    } else {
      errEl.textContent = 'Incorrect username or password.';
    }
  });
</script>
</body>
</html>
